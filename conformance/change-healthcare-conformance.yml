description: >-
  Standards posture of the Change Healthcare Medical Network API surface, read from the
  successor developer portal and the company's own public Postman workspace. Nothing here is
  derived from a spec in this repo, because this repo holds no OpenAPI — the contracts now live
  with Optum. Entries are recorded only where the provider's own published material names the
  standard.
notes: >-
  No published certification or compliance program page was found on any changehealthcare.com
  host (/security, /trust and /compliance all 404; trust. and security. subdomains do not answer
