description: >-
  Change Healthcare publishes NO plans, tiers, rate card or price list on any property. This file
  records that verified absence. It replaces a 2026-05-04 bulk-sweep scaffold that had invented two
  "plans" ("Medical Network APIs" and "Clinical / Interoperability APIs") which the company has
  never published as purchasable tiers — that content was API Evangelist's own framing being
  credited to the provider, and it has been removed.
notes: >-
  Change Healthcare was acquired by UnitedHealth Group and folded into Optum; www.changehealthcare.com
  now 301s to business.optum.com. There is no pricing page on the changehealthcare.com domain and no
  pricing page for the Medical Network APIs on the successor Optum developer portal. Access is
  obtained by requesting sandbox access and then contracting through Optum sales; the commercial
  terms (per-transaction clearinghouse rates) are negotiated per customer and never posted. This is
  an enterprise contact-sales posture, honestly recorded as plan_count 0 rather than dressed as
  tiers.
