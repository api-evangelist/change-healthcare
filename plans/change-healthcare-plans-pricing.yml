specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Change Healthcare
providerId: change-healthcare
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Healthcare
  - EDI
  - Eligibility
  - Claims
description: Change Healthcare (now part of Optum / UnitedHealth Group) operates a healthcare data exchange
  network with APIs for eligibility, claims, payments, prior authorization, and clinical interoperability.
  API pricing is contracted per-customer (per-transaction EDI rates) and is not published on a public
  rate card.
notes: No public price list. Pricing is per-transaction or per-contract; consumers must engage Optum
  / Change Healthcare sales.
sources:
  - https://www.changehealthcare.com
  - https://www.optum.com/business/solutions/data-analytics.html
plans:
  - id: change-healthcare-medical-network
    name: Medical Network APIs
    type: usage-based
    description: Per-transaction APIs for eligibility, claim status, claims submission, ERA, and prior
      authorization. Priced per transaction under negotiated payer/provider contracts.
    entries:
      - label: Per medical network transaction
        name: medical_network_tx
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: contract (per-transaction)
        userMultiplied: false
    elements:
      - name: 270/271 Eligibility
      - name: 276/277 Claim Status
      - name: 837 Claims Submission
      - name: 835 ERA
      - name: 278 Prior Authorization
  - id: change-healthcare-clinical
    name: Clinical / Interoperability APIs
    type: enterprise
    description: FHIR and clinical data exchange APIs for payers, providers, and life-sciences customers.
      Pricing negotiated per engagement.
    entries:
      - label: Clinical / FHIR access
        name: clinical_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contract
        userMultiplied: false
    elements:
      - name: FHIR APIs
      - name: Clinical data exchange
      - name: Patient access workflows
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
