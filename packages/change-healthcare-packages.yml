description: >-
  Change Healthcare ships no first-party client SDK under its own name on any public registry.
  The three RubyGems below are community-maintained wrappers written by customers of the Change
  Healthcare Medical Network APIs, not by the company. NO `SDKs` pointer is emitted in apis.yml,
  because sdk_count must only fire on first-party libraries.
notes: >-
  Optum publishes a "Generate a Client SDK" guide on the successor developer portal rather than
  shipping maintained SDKs, so there is no first-party package to inherit either. Every one of
  these community gems predates or barely postdates the retirement of the
  apis.changehealthcare.com gateway they were written against — the newest release is April 2024
  and the gateway they call is now decommissioned, so all three are functionally abandoned
  against the current Optum endpoints.
