description: >-
  Change Healthcare was one of the largest healthcare technology and clearinghouse companies in the
  United States, moving eligibility, claim, remittance and prior-authorization transactions between
  providers and payers over X12 EDI. UnitedHealth Group acquired it in October 2022 and folded it
  into Optum, and the brand has since been retired: www.changehealthcare.com redirects to
  business.optum.com, developers.changehealthcare.com redirects path-for-path to
  developer.optum.com, and the apis.changehealthcare.com API gateway is decommissioned and
  documented by Optum as "an old domain and no longer supported". The Change Healthcare Medical
  Network APIs — Eligibility v3, Professional Claims v3, Institutional Claims v1, Claim Status v2,
  Claims Responses and Reports v2, Attachments, PayerList v1 and Prior Authorization v1 — are still
  operated and documented, but on Optum infrastructure and under Optum hosts.
