apis:
- aid: change-healthcare:change-healthcare-api
  name: Change Healthcare Medical Network API
  tags:
  - Healthcare
  - EDI
  - Eligibility
  - Claims
  - Prior Authorization
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://apigw.optum.com/medicalnetwork/
  humanURL: https://developers.changehealthcare.com/
  description: >-
    JSON-over-REST front end to the HIPAA X12 EDI transaction set — 270/271 eligibility, 276/277
    claim status, 837P/837I claim submission and validation, 835/277 claims responses and reports,
    278 prior authorization and referrals, claim attachments, and the payer list. OAuth 2.0 client
    credentials against apip/auth/v2/token, one-hour bearer tokens, versioning carried in the URL
    path.
  properties:
  - url: https://developer.optum.com/eligibilityandclaims/docs
    type: Documentation
    name: >-
      Successor documentation. developers.changehealthcare.com CNAMEs to developer.optum.com and
      301s path-for-path (verified: /eligibilityandclaims/docs/api-urls on the changehealthcare.com
      host lands on the identical Optum page), so this is the Change Healthcare Medical Network
      reference under its acquirer.
  - url: https://developer.optum.com/eligibilityandclaims/reference/api-overview
    type: APIReference
  - url: https://developer.optum.com/eligibilityandclaims/docs/get-started-with-optum-api
    type: GettingStarted
  - url: https://developer.optum.com/eligibilityandclaims/docs/create-a-sandbox-account
    type: SignUp
    name: Request sandbox access — there is no self-serve signup.
  - url: https://developer.optum.com/eligibilityandclaims/docs/eligibility-release-notes
    type: ChangeLog
    name: Dated release notes for Medical Network Eligibility.
  - url: https://www.postman.com/changehealthcare-cdp-dev/workspace/change-healthcare-medical-network-apis/overview
    type: Postman
    name: >-
      Public Postman workspace published by the changehealthcare-cdp-dev team, carrying the Medical
      Network Eligibility v3, Professional Claims v3, Institutional Claims v1, Claim Status v2 and
      Claims Responses and Reports collections. Note postman.com soft-200s every URL, so presence
      was established from indexed collection pages under the workspace, not from the status code.
  - url: lifecycle/change-healthcare-lifecycle.yml
    type: Lifecycle
  - url: conformance/change-healthcare-conformance.yml
    type: Conformance
