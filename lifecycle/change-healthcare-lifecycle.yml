  catalogued_as: all/optum
  note: >-
    The Change Healthcare Medical Network API contracts (Eligibility v3, Professional Claims v3,
    Institutional Claims v1, Claim Status v2, Claims Responses and Reports v2, Attachments
    submission/status/retrieval, Payer List, Prior Authorization) are published by Optum at
