description: >-
  Change Healthcare publishes no numeric rate limit, no burst allowance and no rate-limit response
  header contract on any property. This file records that verified absence. It replaces a 2026-05-04
  bulk-sweep scaffold that asserted a 429/401 response-code contract and three "policies" (backoff,
  sandbox-vs-production throttling, BAA handling) that the company does not publish in those terms —
  API Evangelist advice credited to the provider, now removed.
notes: >-
  The changehealthcare.com API gateway is retired (see lifecycle/change-healthcare-lifecycle.yml), so
  no live unauthenticated response could be observed carrying rate-limit headers — every path on
  apis.changehealthcare.com answers 400 invalid_request. The successor Optum developer portal
  documents API RESPONSE AND TIMEOUT TIMES for the former Change Healthcare Medical Network APIs, but
  a timeout is not a rate limit: it publishes no requests-per-window ceiling, no X-RateLimit-* or
  RateLimit-* header set, and no documented status code on exhaustion. Throughput is governed by the
  customer's clearinghouse contract and onboarding configuration, which is not public.
