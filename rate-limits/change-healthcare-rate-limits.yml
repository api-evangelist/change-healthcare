specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Change Healthcare
providerId: change-healthcare
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Healthcare
  - EDI
description: Change Healthcare does not publish numeric rate limits on its developer portal. API access
  is provisioned per contracted customer; per-API throttling is governed by the contract and onboarding
  configuration.
notes: No public per-second/per-minute rate limit numbers documented; contract-governed.
sources:
  - https://www.changehealthcare.com
responseCodes:
  throttled: 429
  unauthorized: 401
limits:
  - name: Medical Network APIs
    scope: api_key
    metric: varies
    limit: see customer contract
  - name: Clinical / FHIR APIs
    scope: api_key
    metric: varies
    limit: see customer contract
policies:
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on 429/503 and honor Retry-After when present.
  - name: Sandbox vs production
    description: Sandbox traffic is throttled lower than production; do not load-test production credentials.
  - name: HIPAA / PHI handling
    description: All access to PHI requires BAA and security configuration agreed during onboarding.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
