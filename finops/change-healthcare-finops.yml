principles:
  - name: Visibility
    description: Use Change Healthcare reporting and EDI 999/277 acknowledgements to track transaction
      volume; reconcile monthly invoices against transaction counts.
  - name: Allocation
    description: Allocate by payer, line of business, and trading partner using EDI metadata.
  - name: Optimization
    description: Reduce duplicate eligibility checks via caching, batch claims where supported, and audit
      rejection rates to lower retransmissions.
  - name: Accountability
    description: Revenue cycle / clearinghouse manager owns Change Healthcare invoices; review monthly
      against payer mix and rejection trends.
